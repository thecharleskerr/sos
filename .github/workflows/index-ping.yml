name: Tell search engines what changed

# After anything lands on main, build both sites and submit every URL to
# IndexNow. Google is not on IndexNow; it reads the sitemap Cloudflare serves.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node packages/data/seo/indexnow.mjs --site sims
      - run: node packages/data/seo/indexnow.mjs --site phones
